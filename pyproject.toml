[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compass"
version = "0.1.0"
description = "IBM Bob 2.0 agent that produces developer-onboarding packs from unfamiliar Git repos."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Poornasri" }]
keywords = ["ibm-bob", "watsonx", "onboarding", "developer-experience", "hackathon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "pathspec>=0.12",
    "pymongo>=4.7",
    "mongomock>=4.1",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.36",
]
google = [
    "streamlit-oauth>=0.1.14",
    "google-auth>=2.30",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "respx>=0.21",
]

[project.scripts]
compass = "compass.cli:main"

[project.urls]
Homepage = "https://github.com/Poornasri2003/compass"
Hackathon = "https://lablab.ai/ai-hackathons/ibm-bob-2-hackathon"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
